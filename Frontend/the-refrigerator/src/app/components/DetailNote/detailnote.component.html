<div class="detail-note">
    <button class="close" (click)="noteClose.emit()">X</button>
    <h1 class="tittle">{{ noteInfo().tittleNote }}</h1>
    <p class="body">{{ noteInfo().bodyNote }}</p>
    <button class="pin" (click)="pinNote.emit(noteInfo().id)">pin</button>
    <button class="edit" [routerLink]="['/note', noteInfo().id]">edit</button>
    <button class="delete" (click)="deleteNote.emit(noteInfo().id)">delete</button>
</div>
